name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bun (used by this project)
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure base path
        id: basepath
        run: |
          # For project pages (user.github.io/<repo>) set NEXT_BASE_PATH to /<repo>.
          # For user/org pages (user.github.io) leave it empty.
          if [ "${{ github.repository_owner }}" = "$(echo ${{ github.repository }} | cut -d/ -f2)" ]; then
            echo "value=" >> "$GITHUB_OUTPUT"
          else
            REPO=$(echo ${{ github.repository }} | cut -d/ -f2)
            echo "value=/$REPO" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static site
        run: NEXT_BASE_PATH=${{ steps.basepath.outputs.value }} bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
